<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">project-starter</title>
<desc id="d">Describe what you are building and get a tailored, agent-ready repository. A terminal shows proj new mealplan with a web app description, and the output: understood as a web app on node with the Creative Director kit and a security reviewer for payments.</desc>
<style>
.sans{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace;font-size:14px}
.caret{animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#334155"/></pattern>
</defs>
<rect width="1200" height="420" rx="20" fill="url(#bg)"/>
<rect width="1200" height="420" rx="20" fill="url(#dots)" opacity=".5"/>
<g transform="translate(56 64)">
<rect width="56" height="56" rx="12" fill="#1f2937" stroke="#334155"/>
<path d="M17.5 14v28M17.5 21c0 7 21 3.5 21 12.25V42M17.5 21c0 0 0-7 10.5-7" fill="none" stroke="#34d399" stroke-width="4.4" stroke-linecap="round"/>
<circle cx="17.5" cy="14" r="4.4" fill="#34d399"/><circle cx="38.5" cy="42" r="4.4" fill="#34d399"/><circle cx="17.5" cy="42" r="4.4" fill="#34d399"/>
</g>
<g class="sans">
<text x="56" y="170" font-size="40" font-weight="700" fill="#f1f5f9">project-starter</text>
<text x="56" y="214" font-size="20" fill="#cbd5e1">Say what you're building.</text>
<text x="56" y="242" font-size="20" fill="#cbd5e1">Get a repository set up the way</text>
<text x="56" y="270" font-size="20" fill="#cbd5e1">a careful senior engineer would.</text>
<g font-size="13" fill="#34d399">
<rect x="56" y="310" width="62" height="26" rx="13" fill="#064e3b" opacity=".6"/><text x="87" y="327" text-anchor="middle">tests</text>
<rect x="126" y="310" width="76" height="26" rx="13" fill="#064e3b" opacity=".6"/><text x="164" y="327" text-anchor="middle">cheap CI</text>
<rect x="210" y="310" width="76" height="26" rx="13" fill="#064e3b" opacity=".6"/><text x="248" y="327" text-anchor="middle">GitHub</text>
<rect x="294" y="310" width="88" height="26" rx="13" fill="#064e3b" opacity=".6"/><text x="338" y="327" text-anchor="middle">AGENTS.md</text>
</g>
</g>
<g transform="translate(500 48)">
<rect width="652" height="324" rx="14" fill="#0b1120" stroke="#334155"/>
<circle cx="24" cy="22" r="6" fill="#f87171"/><circle cx="44" cy="22" r="6" fill="#fbbf24"/><circle cx="64" cy="22" r="6" fill="#34d399"/>
<text x="326" y="27" text-anchor="middle" class="sans" font-size="13" fill="#64748b">terminal</text>
<line x1="0" y1="44" x2="652" y2="44" stroke="#1e293b"/>
<g class="mono" fill="#cbd5e1">
<text x="24" y="80"><tspan fill="#34d399">$</tspan> proj new mealplan "A web app where families plan</text>
<text x="41" y="102">weekly meals and pay a monthly subscription with Stripe"</text>
<text x="24" y="140" fill="#f1f5f9"><tspan fill="#34d399" font-weight="700">Understood:</tspan> web-app on node · visual (Creative Director kit)</text>
<text x="41" y="162" fill="#f1f5f9">· security reviewer for payments</text>
<text x="41" y="188" fill="#94a3b8">- kind: web-app ("web app")</text>
<text x="41" y="210" fill="#94a3b8">- sensitive: payments</text>
<text x="41" y="232" fill="#94a3b8">- visual: yes (web-app has screens)</text>
<text x="24" y="258">created …\mealplan</text>
<text x="24" y="296"><tspan fill="#34d399">$</tspan></text>
