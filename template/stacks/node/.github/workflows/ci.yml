name: CI
# Drafts cost nothing: the job below is skipped before any runner starts. Marking the PR ready
# (ready_for_review) runs it for real, on the exact head SHA. A skipped check is NOT a pass:
# `proj ready` and `proj status` count only conclusion=success for the head SHA.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record the exact SHA under test
        run: echo "Verified SHA $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: if [ -f package-lock.json ]; then npm ci; fi
      - run: npm test
