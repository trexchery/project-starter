name: Heavy
run-name: Heavy ${{ inputs.sha }}
# Expensive suites (audits, E2E, mutation). Manual only, once per SHA: `proj check --heavy --ci --yes`
# dispatches it after the owner approves the minutes; prefer running them locally or on approved compute first.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit to verify
        required: true
      force:
        description: Run even if this SHA already passed
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

jobs:
  heavy:
    concurrency:
      group: heavy-${{ inputs.sha }}
      cancel-in-progress: false
    runs-on: ${{ vars.PROJ_RUNS_ON != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && fromJSON(vars.PROJ_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # One full run per SHA: if this exact commit already passed "heavy", report that instead of re-testing.
      - name: Reuse a passing result for this exact SHA
        id: reuse
        if: ${{ !inputs.force }}
        uses: actions/github-script@v9
        env:
          SHA: ${{ inputs.sha }}
        with:
          script: |
            const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: process.env.SHA, check_name: 'heavy', filter: 'all', per_page: 100 });
            const prior = data.check_runs.find((c) => c.conclusion === 'success' && c.app?.slug === 'github-actions' && !c.details_url?.includes(`/runs/${context.runId}/`));
            if (prior) { core.setOutput('hit', 'true'); await core.summary.addRaw(`Reused the passing run for ${process.env.SHA}: ${prior.html_url}`).write(); }
      - uses: actions/checkout@v7
        if: steps.reuse.outputs.hit != 'true'
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Record the exact SHA under test
        if: steps.reuse.outputs.hit != 'true'
        run: echo "Verified SHA $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        if: steps.reuse.outputs.hit != 'true'
        with: { node-version: 22 }
      - run: npm ci
        if: steps.reuse.outputs.hit != 'true'
      - run: npm audit --audit-level=high
        if: steps.reuse.outputs.hit != 'true'
      - run: npm run test:heavy --if-present
        if: steps.reuse.outputs.hit != 'true'
